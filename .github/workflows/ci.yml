name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v0
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './v0/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Security audit
        run: npx audit-ci --moderate --config .audit-ci.jsonc

      - name: Run tests
        run: |
          for shard in $(seq 1 10); do
            echo "Running Vitest shard ${shard}/10"
            npm run test -- --run --shard=${shard}/10
          done
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check build size
        run: |
          echo "Checking build size..."
          du -sh .next/static/ || echo "Build directory not found"

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './v0/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency vulnerability scan
        run: npx audit-ci --config .audit-ci.jsonc

      - name: Check for known security issues
        run: |
          echo "Running security checks..."
          # Check for potential security issues in code
          grep -r "eval(" . --include="*.js" --include="*.ts" --include="*.tsx" || true
          grep -r "innerHTML" . --include="*.js" --include="*.ts" --include="*.tsx" || true

  performance-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './v0/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build for performance analysis
        run: |
          npm run build
          echo "Build completed successfully"

      - name: Analyze bundle size
        run: |
          echo "Analyzing bundle size..."
          if [ -d ".next/static" ]; then
            find .next/static -name "*.js" -exec wc -c {} + | sort -n
            total_size=$(find .next/static -name "*.js" -exec wc -c {} + | tail -1 | awk '{print $1}')
            echo "Total JS bundle size: $total_size bytes"
            if [ $total_size -gt 1048576 ]; then
              echo "Warning: Bundle size exceeds 1MB"
            fi
          else
            echo "Build directory not found"
          fi


# NOTE (2026-08-08, WP-72 Story 4): the `deploy-staging` and `deploy-production`
# jobs were removed. They never deployed anything -- each ended in an `echo`
# saying deployment "would happen here". Their presence implied a red pipeline
# could hold a release, which was false and actively misleading: Vercel is wired
# to this repository and deploys `main` on push regardless of this workflow's
# result. On 2026-08-07 both commits whose CI failed were live in production
# within the hour.
#
# This workflow is a quality signal, NOT a deployment gate. Pushing to `main` IS
# deploying to production. If a real deployment gate is ever wanted, it has to be
# configured on the Vercel side (or Vercel's Git integration disabled and a real
# deploy step added here) -- not by re-adding a stub job.
